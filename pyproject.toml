[project]
name = "portfolio-optimizer"
version = "0.1.0"
description = "BTC/BNB portfolio optimization comparing classical and quantum (Qiskit) algorithms"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26,<2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "qiskit-optimization>=0.6",
    "qiskit-algorithms>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
finance = ["qiskit-finance>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
